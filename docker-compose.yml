# Hermes Open Enterprise
#   docker compose up -d        start / apply changes
#   ./ohermes --help            add / remove employees
#
# Each employee is one folder in Users/<name>/ with its own compose.yml.
# This file never lists employees and is never edited by ohermes: the employee list is
# docker-compose.override.yml (generated by `ohermes`, git-ignored), which Docker Compose merges
# in automatically — it includes Users/<name>/compose.yml and adds each employee's network to
# caddy and egress. Rebuild it any time with: ./ohermes sync

name: hermes-open-enterprise

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # Entry point: routes <subdomain>.<DOMAIN> to that employee's Hermes.
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    restart: unless-stopped
    environment:
      STAGE: ${STAGE:-prod}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      NETWORK_PREFIX: ${NETWORK_PREFIX:-10.213}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      # generated/routes.caddy matches <subdomain>.{$HERMES_DOMAIN} exactly
      HERMES_DOMAIN: ${HERMES_DOMAIN:-localhost}
    volumes:
      - ./Infrastructure/caddy:/etc/caddy:ro
      - ./Logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_PORT:-8080}:80"
    networks:
      # edge must stay the primary network: published-port traffic must not arrive
      # from an employee network (Caddy refuses those — see Caddyfile)
      edge:
        gw_priority: 100
      # + one network per employee (docker-compose.override.yml)
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m, pids: 256}
    logging: *default-logging

  # Egress proxy: the ONLY way out to the internet for the agents (employee networks are internal).
  # Website rules: Config/ohermes.conf → `./ohermes reconf` → Infrastructure/egress/generated/rules.conf
  egress:
    image: ${EGRESS_IMAGE:-ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/squid/hermes/start.sh"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./Infrastructure/egress:/etc/squid/hermes:ro
      - ./Logs/egress:/var/log/squid
    networks:
      # outbound is the primary network (default route to the internet)
      outbound:
        gw_priority: 100
      # + one network per employee (docker-compose.override.yml)
    cap_drop: [ALL]
    # chown of the log/run folders at start, then Squid drops to user proxy
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m, pids: 256}
    logging: *default-logging

  # Cloudflare Tunnel (prod: COMPOSE_PROFILES=tunnel)
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - edge
    depends_on:
      - caddy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1", memory: 256m, pids: 256}
    logging: *default-logging
    profiles:
      - tunnel

  # Daily jobs: 00:15 logs (collect + archive after LOG_RETENTION_DAYS) · 02:00 backups
  ops:
    build: ./Infrastructure/ops
    image: hermes-open-enterprise-ops:local
    restart: unless-stopped
    network_mode: none
    environment:
      TZ: ${TZ:-UTC}
      COMPOSE_PROJECT: hermes-open-enterprise
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_ARCHIVE_ACTION: ${LOG_ARCHIVE_ACTION:-move}
      LOG_ARCHIVE_KEEP_DAYS: ${LOG_ARCHIVE_KEEP_DAYS:-365}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./Users:/users:ro
      - ./Archive:/archive:ro
      - ./Organization-Knowledge:/org:ro
      - ./Logs:/logs
      - ./Backups:/backups
      - /var/lib/docker/containers:/docker-containers:ro
    # root inside, but only: DAC_READ_SEARCH = read every employee's files for the backup,
    # SETGID/SETUID = busybox crond sets the job's groups/user. Nothing else.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m, pids: 256}
    logging: *default-logging

networks:
  edge: {}
  # internet access for the egress proxy only
  outbound: {}

volumes:
  caddy_data:
  caddy_config:
