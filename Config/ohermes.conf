# Config/ohermes.conf — website rules for the agents (admins only; never mounted into an agent)
#
# Check this file with:  ./ohermes check
# Apply it with:         sudo ./ohermes reconf      (preview: ./ohermes reconf --dry-run)
#   enforced by the egress proxy; no agent is restarted; a bad file keeps the previous rules
#
# Sections
#   [web]                         default allow | deny   (whole organization, one line)
#   [web:organization]            rules for every employee
#   [web:department=<Dept>]       rules for one department (case-insensitive, e.g. Sales)
#   [web:user=<server-name>]      rules for one employee (e.g. john-doe)
#
# Rule = one line:   <allow|deny>   <website>   <remark>
#   website : example.com (that domain only) or *.example.com (all subdomains + itself)
#             or one IP address (203.0.113.10, 2001:db8::1) — no paths or ports
#             Websites typed as a raw IP (https://1.2.3.4/…) are ALWAYS denied unless that IP
#             has its own allow line — in default allow and default deny alike.
#   remark  : everything after the website (spaces allowed) — recommended
# Levels add up (organization + department + employee); deny always wins.
# The AI provider in .env is always allowed.

[web]
default   allow               # allow = every website except deny · deny = no website except allow

[web:organization]
# action  website             remark
# allow   *.example.com       Company website
# deny    *.facebook.com      Not work related

# [web:department=Sales]
# allow   *.salesforce.com    Sales CRM

# [web:user=john-doe]
# allow   canva.com           Slides
